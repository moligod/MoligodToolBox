[package]
name = "moligod-crosshair"
version.workspace = true
edition.workspace = true

[dependencies]
moligod-core = { path = "../core" }
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
sha2 = "0.10"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[[example]]
name = "smoke"
path = "examples/smoke.rs"
