[package]
name = "moligod-automation"
version.workspace = true
edition.workspace = true

[dependencies]
moligod-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
regex = "1"
image = { version = "0.25", default-features = false, features = ["png","jpeg","bmp"] }
sha2 = "0.10"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_Threading","Win32_System_Performance","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_HiDpi"] }
windows = { version = "0.61", features = ["Foundation","Win32_System_WinRT"] }
windows-capture = "2.0.1"


[dev-dependencies]
moligod-module-host = { path = '../module-host' }
