[workspace]
members = ["crates/core", "crates/storage", "crates/crosshair", "crates/module-protocol", "crates/module-host", "crates/automation", "modules/crosshair", "modules/automation", "modules/ocr", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
