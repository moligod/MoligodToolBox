name: Signed Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v2.0.0
        required: true
        type: string
      release_name:
        description: Display name for the release
        required: true
        default: v2.0.0
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Validate tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a stable vMAJOR.MINOR.PATCH tag' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
      - name: Validate versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $frontend = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktop = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $workspace = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($frontend -ne $expected -or $desktop -ne $expected -or $workspace -ne $expected) { throw 'Tag and project versions must agree' }
      - name: Prepare build
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/moligod-cargo" >> $env:GITHUB_ENV
          $flags = @("--remap-path-prefix=$env:GITHUB_WORKSPACE=/src/moligod-toolbox", "--remap-path-prefix=$env:USERPROFILE=/_build") -join [char]31
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/prepare-ocr.ps1
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.release_name }}
          releaseBody: See the attached installer and source tag for this release.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config '{"build":{"beforeBuildCommand":"npm run modules:build && npm run build"},"bundle":{"createUpdaterArtifacts":true}}'
      - name: Check release privacy
        shell: pwsh
        run: node scripts/check-release-privacy.mjs
